function getScores(values){if(values.length!==8||values.some(x=>!Number.isInteger(x)||x<0||x>3))throw new Error('请选择全部8题');return DATA.personas.map((_,p)=>values.reduce((sum,a,q)=>sum+DATA.weights[q][a][p],0));}

function rect(c,x,y,w,h,r,fill,stroke){c.beginPath();r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.stroke();}}
function text(c,t,x,y,size=28,weight=400,color=INK){c.fillStyle=color;c.font=`${weight} ${size}px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;c.fillText(t,x,y);}
function fitText(c,t,x,y,maxWidth,size,weight=700){while(size>20){c.font=`${weight} ${size}px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;if(c.measureText(t).width<=maxWidth)break;size--;}text(c,t,x,y,size,weight);}
function wrap(c,t,x,y,width,size=30,line=47,weight=400,color=INK){c.font=`${weight} ${size}px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;let row='',yy=y;for(const char of t){if(c.measureText(row+char).width>width&&row){text(c,row,x,yy,size,weight,color);row=char;yy+=line;}else row+=char;}if(row)text(c,row,x,yy,size,weight,color);return yy+line;}
function line(c,x,y,x2,y2,color=INK,w=2){c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=w;c.stroke();}
function ellipse(c,x,y,rx,ry,fill){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fillStyle=fill;c.fill();}
function star(c,x,y,r){c.save();c.translate(x,y);c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.25:r;i?c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):c.moveTo(rr,0);}c.closePath();c.fillStyle=INK;c.fill();c.restore();}
function icon(c,type,x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.strokeStyle=INK;c.fillStyle=INK;c.lineWidth=5;c.lineCap='round';c.lineJoin='round';
if(type==='bolt'){c.beginPath();c.moveTo(7,-47);c.lineTo(-35,9);c.lineTo(-3,9);c.lineTo(-13,49);c.lineTo(37,-11);c.lineTo(6,-11);c.closePath();c.fill();}
else if(type==='coffee'){rect(c,-30,-24,53,64,8,PAPER,INK);rect(c,24,-10,24,29,10,null,INK);line(c,-17,-37,-13,-53);line(c,5,-37,10,-55);line(c,-35,46,40,46);}
else if(type==='moon'){ellipse(c,0,0,42,42,INK);ellipse(c,20,-16,35,35,'#f5f3e9');star(c,37,-39,11);}
else if(type==='screen'){rect(c,-48,-34,96,63,5,null,INK);line(c,-60,39,60,39);text(c,'>_',-29,10,32,800);}
else if(type==='food'){c.beginPath();c.arc(0,0,44,0,Math.PI);c.closePath();c.fill();line(c,-20,46,20,46);line(c,-28,-25,27,-45);line(c,-20,-16,35,-35);}
else if(type==='map'){c.beginPath();c.moveTo(-45,-34);c.lineTo(-14,-43);c.lineTo(16,-28);c.lineTo(46,-38);c.lineTo(46,32);c.lineTo(15,42);c.lineTo(-15,28);c.lineTo(-45,37);c.closePath();c.stroke();line(c,-14,-43,-15,28);line(c,16,-28,15,42);ellipse(c,17,-10,8,8,INK);}
else if(type==='target'){[43,27,10].forEach(r=>{c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();});line(c,0,0,48,-48);}
else if(type==='sun'){ellipse(c,0,0,24,24,INK);for(let i=0;i<8;i++){const a=i*Math.PI/4;line(c,Math.cos(a)*35,Math.sin(a)*35,Math.cos(a)*48,Math.sin(a)*48);}}
else if(type==='stack'){for(let i=2;i>=0;i--){rect(c,-33+i*9,-42+i*8,56,71,3,PAPER,INK);line(c,-20+i*9,-19+i*8,8+i*9,-19+i*8);}}
else if(type==='battery'){rect(c,-46,-25,85,50,6,null,INK);rect(c,40,-10,10,20,2,INK);rect(c,-38,-17,13,34,2,INK);text(c,'!',-8,15,36,800);}
else if(type==='dice'){rect(c,-40,-40,80,80,12,PAPER,INK);[[-20,-20],[20,20],[0,0],[-20,20],[20,-20]].forEach(([a,b])=>ellipse(c,a,b,5,5,INK));}
else if(type==='leaf'){c.beginPath();c.moveTo(-28,38);c.bezierCurveTo(-66,-10,-7,-51,40,-37);c.bezierCurveTo(43,1,17,48,-28,38);c.fill();line(c,-40,51,24,-23,PAPER,3);}
else if(type==='planet'){ellipse(c,0,0,31,31,INK);c.save();c.rotate(-.4);c.beginPath();c.ellipse(0,0,59,15,0,0,Math.PI*2);c.stroke();c.restore();}
else{c.beginPath();c.moveTo(-34,36);c.lineTo(-34,-7);c.bezierCurveTo(-34,-51,34,-51,34,-7);c.lineTo(34,36);c.lineTo(17,23);c.lineTo(0,36);c.lineTo(-17,23);c.closePath();c.fill();ellipse(c,-12,-8,4,7,PAPER);ellipse(c,12,-8,4,7,PAPER);}
c.restore();}
function mascot(c,type,x,y,scale,accent){c.save();c.translate(x,y);c.scale(scale,scale);ellipse(c,0,147,142,19,'#24282018');c.lineWidth=4;line(c,-48,94,-62,141,INK,9);line(c,47,94,66,141,INK,9);ellipse(c,-70,144,21,8,INK);ellipse(c,76,144,21,8,INK);line(c,-100,11,-142,54,INK,8);line(c,101,8,132,-24,INK,8);ellipse(c,-144,57,10,11,INK);ellipse(c,133,-28,10,11,INK);c.save();c.rotate(-.055);rect(c,-102,-92,204,196,29,PAPER,INK);rect(c,-84,-111,77,27,8,PAPER,INK);line(c,-82,-49,82,-49,'#c5c9bc',2);ellipse(c,-31,-13,8,13,INK);ellipse(c,29,-13,8,13,INK);c.beginPath();c.arc(0,10,19,.15,Math.PI-.15);c.strokeStyle=INK;c.lineWidth=4;c.stroke();rect(c,-50,50,99,28,14,accent);text(c,'HUMAN',-32,69,15,700);c.restore();c.save();c.translate(110,67);c.rotate(.15);rect(c,-50,-50,100,100,20,accent,INK);icon(c,type,0,0,.65);c.restore();star(c,-144,-101,18);star(c,151,-90,26);c.restore();}
function drawHero(){const c=document.getElementById('heroCanvas').getContext('2d');c.clearRect(0,0,720,534);c.save();c.translate(164,255);c.rotate(-.2);rect(c,-94,-164,205,295,14,'#dcd4f9',INK);text(c,'ARCHIVE',-74,-128,20,700);text(c,'?',-39,36,120,900);text(c,'UNIDENTIFIED',-72,99,15,500);c.restore();c.save();c.translate(375,275);c.rotate(.095);rect(c,-132,-202,272,355,14,'#e9ff74',INK);text(c,'EIC / HUMAN FILE',-113,-169,16,700);mascot(c,'bolt',0,-17,.78,'#dcd4f9');text(c,'下一位，是你。',-105,128,24,700);c.restore();c.save();c.translate(534,427);c.rotate(-.12);rect(c,-91,-25,176,47,3,INK);text(c,'COLLECT ME ↗',-75,7,19,700,'#e9ff74');c.restore();}
function drawCard(canvas,p,s){const c=canvas.getContext('2d'), accent=PALETTES[p.id-1];c.clearRect(0,0,1080,1740);c.fillStyle=PAPER;c.fillRect(0,0,1080,1740);c.fillStyle=accent;c.fillRect(0,0,1080,930);c.fillStyle='#2428200d';for(let x=30;x<1080;x+=30)for(let y=25;y<930;y+=30)c.fillRect(x,y,2,2);text(c,'EIC GLOBAL 20 YEARS',62,83,29,800);text(c,'HUMAN COLLECTION',685,81,20,500);line(c,60,115,1020,115,INK,2);text(c,'ARCHIVE',62,170,23,600);text(c,'No.',59,238,40,700);text(c,String(p.id).padStart(2,'0'),135,279,138,900);text(c,'/ 20',325,270,36,400);c.save();c.translate(875,204);c.rotate(.12);c.lineWidth=3;rect(c,-111,-48,222,89,1,null,INK);text(c,'已 收 藏',-85,6,34,700);text(c,'COLLECTED',-76,28,16,500);c.restore();mascot(c,p.symbol,530,476,1.48,accent);text(c,'SPECIMEN / '+s,65,741,25,500);fitText(c,s+' · '+p.name,60,831,960,77,900);wrap(c,p.desc,64,894,951,31,42);line(c,60,960,1020,960,'#bfc3b5',2);text(c,'01 / 常见出没地',65,1009,24,500,'#6b725f');fitText(c,p.place,65,1063,945,31,500);text(c,'02 / 研究员备注',65,1130,24,500,'#6b725f');wrap(c,p.note,65,1181,945,30,43,400);STAT_NAMES.forEach((n,i)=>{let x=65+(i%2)*495,y=1295+Math.floor(i/2)*96;text(c,n,x,y,25,500);text(c,String(p.stats[i]).padStart(2,'0'),x+370,y,25,600);rect(c,x,y+18,420,10,5,'#dce0d2');rect(c,x,y+18,420*p.stats[i]/100,10,5,INK);});line(c,60,1470,1020,1470,'#bfc3b5',2);text(c,'COLLECTED · SYDNEY · 2026',64,1522,25,700);text(c,'20年，见过很多种留学人生。',64,1581,30,500);text(c,'今天，收藏到了你。',64,1625,30,500);for(let i=0;i<49;i++){const w=[2,5,3,1,4][i%5];c.fillStyle=INK;c.fillRect(755+i*5,1555,w,67);}c.fillStyle=INK;c.fillRect(0,1675,1080,65);text(c,'EIC GLOBAL 20 YEARS · ARCHIVED',64,1717,22,500,accent);text(c,'NO.'+String(p.id).padStart(2,'0'),905,1717,22,500,accent);}
function notify(message){const el=document.getElementById('toast');el.textContent=message;setTimeout(()=>el.textContent='',3500);}
function savePoster(){try{const canvas=document.getElementById('resultCanvas');posterURL=canvas.toDataURL('image/png');const filename=`EIC-${school==='Other'?'AU':school}-${result.name}.png`;const preview=document.getElementById('posterPreview'),link=document.getElementById('downloadLink');preview.src=posterURL;link.href=posterURL;link.download=filename;lastFocus=document.activeElement;document.getElementById('saveOverlay').hidden=false;document.getElementById('closeSave').focus();document.body.style.overflow='hidden';const mobile=/Android|iPhone|iPad|iPod|MicroMessenger/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(!mobile){const a=document.createElement('a');a.href=posterURL;a.download=filename;document.body.appendChild(a);a.click();a.remove();document.getElementById('saveHint').textContent='PNG 已生成并尝试下载。如未开始，请点击下方按钮。';}else document.getElementById('saveHint').textContent='长按上方图片，选择“保存图片”。也可尝试下载 PNG 原图；若微信拦截，请在系统浏览器中打开。';}catch(e){notify('图片生成失败，请尝试重新打开，或直接截图保存。');}}
function closeSave(){document.getElementById('saveOverlay').hidden=true;document.body.style.overflow='';if(lastFocus)lastFocus.focus();}
document.getElementById('closeSave').onclick=closeSave;
document.getElementById('saveOverlay').onclick=e=>{if(e.target.id==='saveOverlay')closeSave();};
document.addEventListener('keydown',e=>{if(document.getElementById('saveOverlay').hidden)return;if(e.key==='Escape')closeSave();if(e.key==='Tab'){const first=document.getElementById('closeSave'),last=document.getElementById('downloadLink');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
home();
